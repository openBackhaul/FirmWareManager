domain-controller:

  es-address:
    - es-name: 'domainControllerEsClient'
      url: 'http://127.0.0.1:3015'
      api-key: 'API key not yet defined.'
      index-alias: '23'
      operational-state: 'elasticsearch-client-interface-1-0:OPERATIONAL_STATE_TYPE_NOT_YET_DEFINED'
      life-cycle-state: 'elasticsearch-client-interface-1-0:LIFE_CYCLE_STATE_TYPE_NOT_YET_DEFINED'
    - es-name: 'mwdiEsClient'
      url: 'http://127.0.0.1:3015'
      api-key: 'API key not yet defined.'
      index-alias: '7'
      operational-state: 'elasticsearch-client-interface-1-0:OPERATIONAL_STATE_TYPE_NOT_YET_DEFINED'
      life-cycle-state: 'elasticsearch-client-interface-1-0:LIFE_CYCLE_STATE_TYPE_NOT_YET_DEFINED'

  historical-error-list:
    - errored-function: 'p1MeasureDomain'
      error-message: 'general processing error'
      timestamp: '2026-10-28T14:30:00Z'

  function:
    # Administrative
    - name: 'p1CreateDcFromStartupDS'
      task: 'administrative'
      description: 'Loads DomainController contents from ElasticSearch'
      parameter: []
    - name: 'p1LoadEsAddresses'
      task: 'administrative'
      description: 'Loads ElasticSearch address information from configFile'
      parameter: []
    - name: 'p1LoadParameters'
      task: 'administrative'
      description: 'Loads the parameters of the defined Function (input) and its sub-Functions from the configFile'
      parameter: []
    - name: 'p1ManageFirmware'
      task: 'administrative'
      description: 'Startup of the autonomous firmware management'
      parameter: []
    - name: 'p1Pulser'
      task: 'administrative'
      description: 'Cyclically invokes functions'
      parameter: []
    - name: 'p1ResolveEsAddress'
      task: 'administrative'
      description: 'Resolves ElasticSearch address'
      parameter: []
    - name: 'p1TrimHistoricalErrorList'
      task: 'administrative'
      description: 'Manages the length of historicalErrorList'
      parameter:
        - name: 'maximumLength'
          description: 'Maximum length of the historical error list'
          owner: 'platform'
          value: '200'
          pattern: '^[0-9]{1,4}$'
    # Implementation
    # Interpretation
    - name: 'createDeviceModel'
      task: 'interpretation'
      description: 'Creates a new DeviceModel incl. its MeasurementFunctions parameters'
      parameter: []
    - name: 'deleteDeviceModel'
      task: 'interpretation'
      description: 'Deletes a DeviceModel incl. its MeasurementFunctions parameters'
      parameter: []
    - name: 'p1CreateDevices'
      task: 'interpretation'
      description: 'Creates devices in RunningDS'
      parameter: []
    - name: 'p1DeleteDevices'
      task: 'interpretation'
      description: 'Deletes devices from RunningDS'
      parameter:
        - name: 'maximumPermissibleAge'
          description: 'Maximum permitted age of the device data in the OperationalDS in hours'
          owner: 'platform'
          value: '336'
          pattern: '^[0-9]{1,4}$'
    - name: 'p1PurgeDeviceGroups'
      task: 'interpretation'
      description: 'Purges DeviceGroups from RunningDS'
      parameter:
        - name: 'deleteDeviceGroupServiceName'
          description: 'Name of the service used to delete a DeviceGroup from RunningDS'
          owner: 'platform'
          value: '/delete-device-group'
          pattern: '^/[a-z0-9]+(-[a-z0-9]+)*$'
    - name: 'updateDeviceModel'
      task: 'interpretation'
      description: 'Updates the MeasurementFunctions of an already documented DeviceModel'
      parameter: []
    # Measurement
    - name: 'p1MeasureDomain'
      task: 'measurement'
      description: 'Updates the OperationalDS'
      parameter:
        - name: 'listUpdatedCcsFunctionName'
          description: 'Name of the function that provides the list of updated ControlConstructs'
          owner: 'platform'
          value: 'p1ListUpdatedCcs'
          pattern: '^p[1-9][0-9]?[A-Za-z0-9]{3,}$'
        - name: 'measureDeviceFunctionName'
          description: 'Name of the function that updates the device information in the OperationalDS'
          owner: 'platform'
          value: 'p2MeasureDevice'
          pattern: '^p[1-9][0-9]?[A-Za-z0-9]{3,}$'
        - name: 'mwdiEsName'
          description: 'Name of the Elasticsearch index to be used for loading the MWDI data'
          owner: 'platform'
          value: 'mwdiEsClient'
    - name: 'p1ListUpdatedCcs'
      task: 'measurement'
      description: 'Lists ControlConstructs that have been updated in MWDI'
      parameter:
        - name: 'maxAge'
          description: 'p1ListUpdatedCcs compares the lastSuccessfulCompleteControlConstructUpdateTime of MWDI with its lastExaminationTime. If lastExaminationTime would be very old (e.g., default value), maxAge is limiting the number of entries in updatedMountNames. It is recommended to chose maxAge at least a little higher than the update period to avoid slips'
          owner: 'platform'
          value: '485'
          pattern: '^[0-9]{1,5}$'
        - name: 'metaDataTablePath'
          description: 'Path to the meta-data table in MWDI'
          owner: 'platform'
          value: '/meta-data-table'
    - name: 'p2MeasureDevice'
      task: 'measurement'
      description: 'Interprets an updated ControlConstruct from MWDI'
      parameter:
        - name: 'createDeviceFunctionName'
          description: 'Name of the function for creating devices in the OperationalDS'
          owner: 'platform'
          value: 'p1CreateOperationalDevice'
          pattern: '^p[1-9][0-9]?[A-Za-z0-9]{3,}$'
        - name: 'completeDeviceObjectFunctionName'
          description: 'Name of the function for completing device objects in the OperationalDS'
          owner: 'platform'
          value: 'p1CompleteDeviceObject'
          pattern: '^p[1-9][0-9]?[A-Za-z0-9]{3,}$'
        - name: 'measureHardwareFunctionName'
          description: 'Name of the function for measuring hardware'
          owner: 'platform'
          value: 'p2MeasureHw'
          pattern: '^p[1-9][0-9]?[A-Za-z0-9]{3,}$'
        - name: 'measureFirmwareFunctionName'
          description: 'Name of the function for measuring firmware'
          owner: 'platform'
          value: 'p1MeasureFw'
          pattern: '^p[1-9][0-9]?[A-Za-z0-9]{3,}$'
    - name: 'p1CreateOperationalDevice'
      task: 'measurement'
      description: 'Creates a device object in the OperationalDS'
      parameter: []
    - name: 'p1CompleteDeviceObject'
      task: 'measurement'
      description: 'Completes a device object in the OperationalDS'
      parameter:
        - name: 'single-firmware-package'
          description: 'objectCompletionFunction'
          owner: 'platform'
          value: 'p1ComplementSingleFirmware'
          pattern: '^p[1-9][0-9]?Complement[A-Za-z0-9]*$'
        - name: 'separated-npu-and-rau'
          description: 'objectCompletionFunction'
          owner: 'platform'
          value: 'p1ComplementSeparatedNpuRauToo'
          pattern: '^p[1-9][0-9]?Complement[A-Za-z0-9]*$'
        - name: 'separated-application'
          description: 'objectCompletionFunction'
          owner: 'platform'
          value: 'p1ComplementSeparatedAppToo'
          pattern: '^p[1-9][0-9]?Complement[A-Za-z0-9]*$'
        - name: 'separated-boot-and-web-and-odu'
          description: 'objectCompletionFunction'
          owner: 'platform'
          value: 'p1ComplementSeparatedBootWebOduToo'
          pattern: '^p[1-9][0-9]?Complement[A-Za-z0-9]*$'
    - name: 'p1ComplementSingleFirmware'
      task: 'measurement'
      description: 'Completes the object of a device with firmwareStructure==single-firmware-package in the OperationalDS'
      parameter: []
    - name: 'p1ComplementSeparatedNpuRauToo'
      task: 'measurement'
      description: 'Completes the object of a device with firmwareStructure==separated-npu-and-rau in the OperationalDS'
      parameter: []
    - name: 'p1ComplementSeparatedAppToo'
      task: 'measurement'
      description: 'Completes the object of a device with firmwareStructure==separated-application in the OperationalDS'
      parameter: []
    - name: 'p1ComplementSeparatedBootWebOduToo'
      task: 'measurement'
      description: 'Completes the object of a device with firmwareStructure==separated-boot-and-web-and-odu in the OperationalDS'
      parameter: []
    - name: 'p2MeasureHw'
      task: 'measurement'
      description: 'Updates deviceModel specific hardware dependencies in OperationalDS'
      parameter:
        - name: 'single-firmware-package'
          description: 'hardwareExtractionFunction'
          owner: 'platform'
          value: ''
          pattern: '^p[1-9][0-9]?Extract[A-Za-z0-9]*$'
        - name: 'separated-npu-and-rau'
          description: 'hardwareExtractionFunction'
          owner: 'platform'
          value: ''
          pattern: '^p[1-9][0-9]?Extract[A-Za-z0-9]*$'
        - name: 'separated-application'
          description: 'hardwareExtractionFunction'
          owner: 'platform'
          value: ''
          pattern: '^p[1-9][0-9]?Extract[A-Za-z0-9]*$'
        - name: 'separated-boot-and-web-and-odu'
          description: 'hardwareExtractionFunction'
          owner: 'platform'
          value: ''
          pattern: '^p[1-9][0-9]?Extract[A-Za-z0-9]*$'
    - name: 'p1MeasureFw'
      task: 'measurement'
      description: 'Updates deviceModel specific firmware composition in OperationalDS'
      parameter:
        - name: 'single-firmware-package'
          description: 'firmwareExtractionFunction'
          owner: 'platform'
          value: 'p1ExtractSingleFirmware'
          pattern: '^p[1-9][0-9]?Extract[A-Za-z0-9]*$'
        - name: 'separated-npu-and-rau'
          description: 'firmwareExtractionFunction'
          owner: 'platform'
          value: 'p1ExtractSeparatedNpuRauToo'
          pattern: '^p[1-9][0-9]?Extract[A-Za-z0-9]*$'
        - name: 'separated-application'
          description: 'firmwareExtractionFunction'
          owner: 'platform'
          value: 'p1ExtractSeparatedAppToo'
          pattern: '^p[1-9][0-9]?Extract[A-Za-z0-9]*$'
        - name: 'separated-boot-and-web-and-odu'
          description: 'firmwareExtractionFunction'
          owner: 'platform'
          value: 'p1ExtractSeparatedBootWebOduToo'
          pattern: '^p[1-9][0-9]?Extract[A-Za-z0-9]*$'
    - name: 'p1ExtractSingleFirmware'
      task: 'measurement'
      description: 'Extracts a single activatable firmware component'
      parameter: []
    - name: 'p1ExtractSeparatedNpuRauToo'
      task: 'measurement'
      description: 'Extracts activatable firmware components of classes package or with NPU3 C or RAU as related equipment'
      parameter: []
    - name: 'p1ExtractSeparatedAppToo'
      task: 'measurement'
      description: 'Extracts activatable firmware components of classes package and application software'
      parameter: []
    - name: 'p1ExtractSeparatedBootWebOduToo'
      task: 'measurement'
      description: 'Extracts activatable firmware components with firmwareComponentName starting with IDU, Boo, Web, Rad, or ODU'
      parameter: []
    # Monitoring
    # Validation
    - name: 'p1ValidationManager'
