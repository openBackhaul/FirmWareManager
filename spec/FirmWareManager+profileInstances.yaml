  - profile-name: 'StringProfile'
    uuid: 'fwm-1-0-0-string-p-051'
    capability:
      string-name: 'domainControllerEsClient'
      purpose: 'UUID of the DomainController ES ElasticsearchClient LTP'
      pattern: '^fwm-([0-9]+)-([0-9]+)-([0-9]+)-es-c-es-([0-9]+)-([0-9]+)-([0-9]+)-[0-9]{3}$'
    configuration:
      string-value: 'fwm-1-0-0-es-c-es-1-0-0-???'

  - profile-name: 'StringProfile'
