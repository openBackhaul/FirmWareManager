openapi: 3.0.0
info:
  title: p1MeasureDomain
  version: 1.0.0

x-javascript-interface:
  p1MeasureDomain:
    summary: 'Updates the OperationalDS'
    output:
      success:
        description: 'OperationalDS updated'
    processing:
      p1ListUpdatedCcs:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - mwdi-es-client
                  - last-examination-time
                properties:
                  parameters:
                    type: object
                  mwdi-es-client:
                    type: object
                  last-examination-time:
                    type: string
        output:
          success:
            description: 'Updated ControlConstructs listed'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    updated-mount-names:
                      type: array
                      items:
                        type: string
                    examination-time:
                      type: string
          error:
            description: 'Updated ControlConstructs could not be listed'
            content:
              application/json:
                schema:
                  type: string
      p1UpdateDevice:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - updated-mount-name
                properties:
                  updated-mount-name:
                    type: string
        output:
          success:
            description: 'ControlConstruct interpreted and device updated'
          error:
            description: 'ControlConstruct could not be interpreted'
            content:
              application/json:
                schema:
                  type: string

paths:
  /:
    description: 'no rest path provided by this module'
