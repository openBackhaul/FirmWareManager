openapi: 3.0.0
info:
  title: p1UpdateHw
  version: 1.0.0

x-javascript-interface:
  p1UpdateHw:
    summary: 'Updates deviceModel specific hardware dependencies in OperationalDS'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - updated-mount-name
              - control-construct
            properties:
              updated-mount-name:
                type: string
              control-construct:
                type: object
    output:
      success:
        description: 'Hardware updated in OperationalDS'
      error:
        description: 'Hardware could not be updated in OperationalDS'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'no hardware extraction function defined for deviceModel'
                - 'general processing error'
    processing:

paths:
  /:
    description: 'no rest path provided by this module'
