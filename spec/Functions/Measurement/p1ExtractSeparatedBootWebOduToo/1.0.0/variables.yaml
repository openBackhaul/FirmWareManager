domain-controller:
  type: object
  description: '! simplified representation !'
  properties:
    network-control-domain:
      type: array
      items:
        type: object
        properties:
          storage:
            type: string
            enum:
              - 'operational'

          device:
            type: array
            items:
              type: object
              properties:
                mount-name:
                  type: string
                  description: >
                    'find [updatedMountName]'
                firmware-list:
                  type: array
                  description: >
                    'delete and replace from [updatedFirmwareList]'
                boot-firmware-list:
                  type: array
                  description: >
                    'delete and replace from [updatedBootFirmwareList]'
                web-server-list:
                  type: array
                  description: >
                    'delete and replace from [updatedWebServerList]'
                odu-firmware-list:
                  type: array
                  description: >
                    'delete and replace from [updatedOduFirmwareList]'
