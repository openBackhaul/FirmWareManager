                IF ( [/firmwareComponentList/firmware-component-pac/firmware-component-capability/individual-activation-is-avail]==true
                    AND [/firmwareComponentList/firmware-component-pac/firmware-component-capability/firmware-component-name].substring(0,3)==ODU )'
          status:
            type: string
            description: >
