openapi: 3.0.0
info:
  title: p1MeasureDevice
  version: 1.0.0

x-javascript-interface:
  p1MeasureDevice:
    summary: 'Interprets an updated ControlConstruct from MWDI'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - updated-mount-name
              - control-construct
            properties:
              updated-mount-name:
                type: string
              control-construct:
                type: object
    output:
      success:
        description: 'ControlConstruct interpreted'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'ok'
    processing:
      p1MeasureHw:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - updated-mount-name
                  - control-construct
                properties:
                  updated-mount-name:
                    type: string
                    description: >
                      'from [/updateDevice/updatedMountName]'
                  control-construct:
                    type: object
                    description: >
                      'from [/updateDevice/controlConstruct]'
        output:
          success:
            description: 'Hardware updated in OperationalDS'
            content:
              application/json:
                schema:
                  type: string
      p1MeasureFw:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - updated-mount-name
                  - control-construct
                properties:
                  updated-mount-name:
                    type: string
                    description: >
                      'from [/updateDevice/updatedMountName]'
                  control-construct:
                    type: object
                    description: >
                      'from [/updateDevice/controlConstruct]'
        output:
          success:
            description: 'Firmware updated in OperationalDS'
            content:
              application/json:
                schema:
                  type: string

paths:
  /:
    description: 'no rest path provided by this module'
