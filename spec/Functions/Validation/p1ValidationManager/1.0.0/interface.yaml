openapi: 3.0.0
info:
  title: p1ValidationManager
  version: 1.0.0

x-javascript-interface:
  p1ValidationManager:
    summary: 'Orchestrates validation of CandidateDS'
    input:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - trigger-function
            properties:
              trigger-function:
                type: string
    output:
      success:
        description: 'Validation accomplished'
        content:
          application/json:
            schema:
              type: object
              required:
                - result
              properties:
                result:
                  type: string
                  enum:
                    - passed
                    - failed
                reason:
                  type: string
      error:
        description: 'Validation could not be accomplished'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'validation sequence could not be found'
                - 'validation sequence could not be executed'
    processing:
      _ValidationFunction_:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - trigger-function
                properties:
                  trigger-function:
                    type: string
        output:
          success:
            description: 'Validation executed'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    result:
                      type: string
                    reason:
                      type: string
          error:
            description: 'Validation could not be executed'
            content:
              application/json:
                schema:
                  type: string

paths:
  /:
    description: 'no rest path provided by this module'
