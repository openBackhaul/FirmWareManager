openapi: 3.0.0
info:
  title: p1CreateDcFromStartupDS
  version: 1.0.0

x-javascript-interface:
  p1CreateDcFromStartupDS:
    summary: 'Loads DomainController contents from ElasticSearch'
    output:
      success:
        description: 'DomainController loaded'
      error:
        description: 'DomainController could not be loaded'
        content:
          application/json:
            schema:
              type: string
              enum:
                - 'configFile not found or not accessible'
                - 'configFile is not valid JSON'
                - 'configFile does not conform to the expected schema'
                - 'functionName not found in configFile'
                - 'unknown error occurred'
                - 'ElasticSearchClient not found in DomainController'
                - 'dataStoreUrl invalid'
                - 'ElasticSearch read error'
                - 'DomainController data not found in ElasticSearch'
                - 'general processing error'
    processing:
      p1LoadParameters:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - function-name
                properties:
                  function-name:
                    type: string
        output:
          success:
            content:
              application/json:
                schema:
                  type: object
                  required:
                    - parameters
                    - config-file
                  properties:
                    parameters:
                      type: object
                    config-file:
                      type: object
          error:
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'configFile not found or not accessible'
                    - 'configFile is not valid JSON'
                    - 'configFile does not conform to the expected schema'
                    - 'functionName not found in configFile'
                    - 'unknown error occurred'

paths:
  /:
    description: 'no rest path provided by this module'
