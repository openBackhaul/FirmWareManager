load-es-addresses:
  type: object
  properties:
    function-name:
      type: string
      enum:
        - 'p1LoadEsAddresses'

    parameters:
      type: object
      description: >
        'Hierarchical object holding the parameter settings
        from {$p1LoadParameters.output#/parameters}'
    config-file:
      type: object
      description: >
        'configFile content
        from {$p1LoadParameters.output#/config-file}'
    load-parameters-error:
      type: string
      description: >
        'Error message if p1LoadParameters failed
        from {$p1LoadParameters.output#/error}'
    resolve-es-address-error:
      type: string
      description: >
        'Error message if p1ResolveEsAddress failed
        from {$p1ResolveEsAddress.output#/error}'
    
    es-names:
      type: array
      x-key: name
      items:
        type: object
        required:
          - name
        properties:
          name:
            type: string
            description: 'ElasticSearch name'
            enum:
              - 'mwdiEsClient'
              - 'domainControllerEsClient'

    es-address:
      type: array
      x-key: es-name
      description: 'List of ElasticSearch addresses'
      items:
        type: object
        required:
          - es-name
          - url
          - api-key
          - index-alias
          - service-records-policy
          - operational-state
          - life-cycle-state
        properties:
          es-name:
            type: string
            description: >
              'ElasticSearch name
              from {$p1ResolveEsAddress.input/es-name}'
          url:
            type: string
            description: >
              'ElasticSearch URL
              from {$p1ResolveEsAddress.output/es-address/url}'
          api-key:
            type: string
            description: >
              'ElasticSearch API key
              from {$p1ResolveEsAddress.output/es-address/api-key}'
          index-alias:
            type: string
            description: >
              'ElasticSearch index alias
              from {$p1ResolveEsAddress.output/es-address/index-alias}'
          service-records-policy:
            type: string
            description: >
              'Service records policy
              from {$p1ResolveEsAddress.output/es-address/service-records-policy}'
          operational-state:
            type: string
            description: >
              'Operational state
              from {$p1ResolveEsAddress.output/es-address/operational-state}'
          life-cycle-state:
            type: string
            description: >
              'Life cycle state
              from {$p1ResolveEsAddress.output/es-address/life-cycle-state}'
