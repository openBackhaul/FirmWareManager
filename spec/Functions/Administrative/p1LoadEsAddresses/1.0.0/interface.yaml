openapi: 3.0.0
info:
  title: p1LoadEsAddresses
  version: 1.0.0

x-javascript-interface:
  p1LoadEsAddresses:
    summary: 'Loads ES addresses and makes them available at DomainController'
    processing:
      p1LoadParameters:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - function-name
                properties:
                  function-name:
                    type: string
                    description: >
                      'Name of the Function whose parameters are to be loaded from the configFile
                      from [/load-es-addresses/function-name]'
        output:
          success:
            description: 'Parameters successfully loaded'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    parameters:
                      type: object
                    config-file:
                      type: object
          error:
            description: 'Parameters could not be loaded'
            content:
              application/json:
                schema:
                  type: string
      # @Katharina -> Bitte Logging eines von der generischen Funktion gemeldeten Fehlers als ProcessingStep dokumentieren.
      # @Katharina -> Bitte Dokumentation einer CreateOperation auf den RAM (hier DomainController) mit output:, success: und description: abschließen
      # @Katharina -> Es wird unterstellt, dass das neue Object immer erfolgreich erstellt werden kann.
      # @Katharina -> Bei UpdateOperationen oder LeseOperationen ist als error mindestens der Fall, dass das Object nicht gefunden wurde, zu berücksichtigen.
      p1ResolveEsAddress:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - config-file
                  - es-name
                properties:
                  parameters:
                    type: object
                    description: >
                      'Hierarchical object holding the parameter settings
                      from [/load-es-addresses/parameters/sub-function=p1ResolveEsAddress]'
                  config-file:
                    type: object
                    description: >
                      'configFile content
                      from [/load-es-addresses/config-file]'
                  es-name:
                    type: string
                    description: >
                      'ElasticSearch name
                      from [/load-es-addresses/es-address=*/name]'
        output:
          success:
            description: 'ES address successfully resolved'
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    es-address:
                      type: object
          error:
            description: 'ES address could not be resolved'
            content:
              application/json:
                schema:
                  type: string
      # @Katharina -> Bitte Logging eines von der generischen Funktion gemeldeten Fehlers als ProcessingStep dokumentieren.
      # @Katharina -> Bitte Dokumentation einer CreateOperation auf den RAM (hier DomainController) mit output:, success: und description: abschließen
      # @Katharina -> Es wird unterstellt, dass das neue Object immer erfolgreich erstellt werden kann.
      # @Katharina -> Bei UpdateOperationen oder LeseOperationen ist als error mindestens der Fall, dass das Object nicht gefunden wurde, zu berücksichtigen.
      writeEsAddress:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                  - address
                properties:
                  name:
                    type: string
                    description: >
                      'ElasticSearch index name
                      from [/load-es-addresses/es-address=*/name]
                      to be written into [/domain-controller/elastic-search-addresses[*]/name]'
                  address:
                    type: object
                    description: >
                      'ElasticSearch index address
                      from [/load-es-addresses/es-address=*/address]
                      to be written into [/domain-controller/elastic-search-addresses[*]/address]'
        output:
          success:
            description: 'ES address made available at DomainController'
            content:
              schema:
                schema:
                  type: string
                  enum:
                    - 'ES address made available'
          error:
            description: 'ES address could not be made available at DomainController'
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'ES address could not be made available'

paths:
  /:
    description: 'no rest path provided by this module'
