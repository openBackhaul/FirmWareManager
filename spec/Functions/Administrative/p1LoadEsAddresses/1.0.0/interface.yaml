openapi: 3.0.0
info:
  title: p1LoadEsAddresses
  version: 1.0.0

x-javascript-interface:
  p1LoadEsAddresses:
    summary: 'Loads ElasticSearch address information from configFile'
    output:
      success:
        description: 'ElasticSearch addresses loaded'
      error:
        description: 'ElasticSearch addresses could not be loaded'
        content:
          application/json:
            schema:
              type: string
              description: >
                'from [/loadEsAddresses/errorMessage]'
              enum:
                - 'configFile not found or not accessible'
                - 'configFile is not valid JSON'
                - 'configFile does not conform to the expected schema'
                - 'functionName not found in configFile'
                - 'unknown error occurred'
                - 'es-name not found in parameters'
                - 'es-client-uuid could not be resolved'
                - 'es-client LTP could not be found in config-file'
                - 'http-client-uuid could not be resolved'
                - 'http-client LTP could not be found in config-file'
                - 'tcp-client-uuid could not be resolved'
                - 'tcp-client LTP could not be found in config-file'
                - 'url could not be resolved'
                - 'api-key could not be resolved'
                - 'index-alias could not be resolved'
                - 'operational-state could not be resolved'
                - 'life-cycle-state could not be resolved'
                - 'general processing error'
    processing:
      p1LoadParameters:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - function-name
                properties:
                  function-name:
                    type: string
                    description: >
                      'from [/loadEsAddresses/functionName]'
        output:
          success:
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    parameters:
                      type: object
                    config-file:
                      type: object
          error:
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'configFile not found or not accessible'
                    - 'configFile is not valid JSON'
                    - 'configFile does not conform to the expected schema'
                    - 'functionName not found in configFile'
                    - 'unknown error occurred'
      _resolveEsAddressFunctionName_:
        input:
          required: true
          content:
            application/json:
              schema:
                type: object
                required:
                  - parameters
                  - config-file
                  - es-name
                properties:
                  parameters:
                    type: object
                    description: >
                      'from [/loadEsAddresses/parameters/sub-function={resolveEsAddressFunctionName}]'
                  config-file:
                    type: object
                    description: >
                      'from [/loadEsAddresses/configFile]'
                  es-name:
                    type: string
                    description: >
                      'from [ /loadEsAddresses/esName[i] ]'
        output:
          success:
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    es-address:
                      type: object
                      properties:
                        url:
                          type: string
                        api-key:
                          type: string
                        index-alias:
                          type: string
                        service-records-policy:
                          type: string
                        operational-state:
                          type: string
                        life-cycle-state:
                          type: string
          error:
            content:
              application/json:
                schema:
                  type: string
                  enum:
                    - 'es-name not found in parameters'
                    - 'es-client-uuid could not be resolved'
                    - 'es-client LTP could not be found in config-file'
                    - 'http-client-uuid could not be resolved'
                    - 'http-client LTP could not be found in config-file'
                    - 'tcp-client-uuid could not be resolved'
                    - 'tcp-client LTP could not be found in config-file'
                    - 'url could not be resolved'
                    - 'api-key could not be resolved'
                    - 'index-alias could not be resolved'
                    - 'operational-state could not be resolved'
                    - 'life-cycle-state could not be resolved'
                    - 'unknown error occurred'

paths:
  /:
    description: 'no rest path provided by this module'
