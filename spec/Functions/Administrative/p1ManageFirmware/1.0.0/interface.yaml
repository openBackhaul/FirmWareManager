openapi: 3.0.0
info:
  title: p1ManageFirmware
  version: 1.0.0

x-javascript-interface:
  p1ManageFirmware:
    summary: 'Startup of the autonomous firmware management'
    output:
      error:
        description: 'Firmware management stopped due to an error'
    processing:
      p1LoadEsAddresses:
        output:
          success:
            description: 'ElasticSearch addresses loaded'
          error:
            description: 'ElasticSearch addresses could not be loaded'
            content:
              application/json:
                schema:
                  type: string
      p1CreateDcFromStartupDS:
        output:
          success:
            description: 'DomainController loaded'
          error:
            description: 'DomainController could not be loaded'
            content:
              application/json:
                schema:
                  type: string
      p1Pulser:
        output:
          error:
            description: 'Pulser stopped due to an error'

paths:
  /:
    description: 'no rest path provided by this module'
