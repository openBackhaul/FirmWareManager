function:
  - name: 'p1ListUpdatedCcs'
    task: 'measurement'
    description: 'Determines the list of ControlConstructs that have been updated in MWDI since last update of OperationalDS.'
    parameter:
      - name: 'maxAge'
        description: 'p1ListUpdatedCcs compares the lastSuccessfulCompleteControlConstructUpdateTime of MWDI with its lastExaminationTime. If lastExaminationTime would be very old (e.g., default value), maxAge is limiting the number of entries in updatedMountNames. It is recommended to chose maxAge at least a little higher than the update period to avoid slips.'
        owner: 'platform'
        value: '485'
        pattern: '^[0-9]{1,5}$'
  - name: 'p1TrimHistoricalErrorList'
    task: 'administrative'
    description: 'Deletes the oldest entries from the historicalErrorList until maximumLength is no longer exceeded.'
    parameter:
      - name: 'maximumLength'
        description: 'Maximum length of the historical error list'
        owner: 'platform'
        value: '100'
        pattern: '^[0-9]{1,4}$'
