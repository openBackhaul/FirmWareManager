list-existing-servers:
  type: object
  properties:

    domain-controller:
      type: object
      description: >
        '! simplified representation !'
      properties:
        network-control-domain:
          type: array
          x-key: storage
          items:
            type: object
            properties:
              storage:
                type: string
                enum:
                  - 'running'
              server:
                type: array
                x-key: label
                description: 'List of server definitions'
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      description: 'Unique and invariant label of the server, from where the firmware resource can be downloaded'
                    user-name:
                      type: string
                      description: 'User name to access the file server for downloading the firmware'
                    password:
                      type: string
                      description: 'Password to access the file server for downloading the firmware'
                    ssh-key:
                      type: string
                      description: 'Client key for accessing the file server'
