delete-server:
  type: object
  required:
    - label
  properties:
    label:
      type: string
      description: >
        'Unique and invariant label of the server, from where the firmware resource can be downloaded
        from {$input#/label}'


    # TODO: wie bei createOrUpdateServer: wieso taucht hier der runningDS nirgends auf?
    # in den wird zwar nicht direkt geschrieben, aber aus ihm wird gelesen und ggf. wird er dann mit dem 
    # Candidate überschrieben.
    domain-controller:
      type: object
      description: >
        '! simplified representation !'
      properties:
        network-control-domain:
          type: array
          x-key: storage
          items:
            type: object
            properties:
              storage:
                type: string
                enum:
                  - 'candidate'
              server:
                type: array
                x-key: label
                description: >
                  'List of server definitions
                  delete [/delete-server/domain-controller/network-control-domain=candidate/server={$input#/label}]
                  IF [/delete-server/domain-controller/network-control-domain=candidate/firmware-resource=*/server] does NOT contain {$input#/label}'
                items:
                  type: object
                  properties:
                    label:
                      type: string
                      description: 'Unique and invariant label of the server, from where the firmware resource can be downloaded'
              firmware-resource:
                type: array
                x-key: name,version
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 'Name of the firmware component'
                    version:
                      type: string
                      description: 'Version of the firmware component'
                    server:
                      type: string
                      description: 'Reference to a server definition that documents the access credentials for downloading the firmware components'
