update-target-firmware:
  type: object
  required:
    - deviceGroupLabel
    - firmwareResourceName
    - firmwareResourceVersion
    - firmwareStatus
  properties:
    deviceGroupLabel:
      type: string
      description: >
        'from [/requestBody/device-group-label]'
    firmwareResourceName:
      type: string
      description: >
        'from [/requestBody/firmware-resource-name]'
    firmwareResourceVersion:
      type: string
      description: >
        'from [/requestBody/firmware-resource-version]'
    firmwareStatus:
      type: string
      description: >
        'from [/requestBody/firmware-status]'

    targetFirmwareList:
      type: array
      description: >
        'from [/domain-controller/network-control-domain=running/device-group={deviceGroupLabel}/target-firmware-list]'
      items:
        type: object
        properties:
          resource:
            type: string
          status:
            type: string
            description: >
              'from [{stand-by} IF firmwareStatus=={active}]'

    combination:
      type: string
      description: >
        'from [firmwareResourceName + {,} + firmwareResourceVersion]'

    updatedTargetFirmwareList:
      type: array
      description: >
        'from [targetFirmwareList]'
      items:
        type: object
        properties:
          resource:
            type: string
            description: >
              'find [combination]'
          status:
            type: string
            description: >
              'from [firmwareStatus]'

    affectedDevices:
      type: array
      description: >
        'from [/domain-controller/network-control-domain=candidate/device-group={deviceGroupLabel}/device]'
      items:
        type: string
    updatedFirmwareList:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            description: >
              'from [updatedTargetFirmwareList[i].resource].split(',')[0]'
          version:
            type: string
            description: >
              'from str.slice(str.indexOf(',') + 1) with str=[updatedTargetFirmwareList[i].resource]'
          status:
            type: string
            description: >
              'from [updatedTargetFirmwareList[i].status]'

domain-controller:
  type: object
  description: '! simplified representation !'
  properties:
    network-control-domain:
      type: array
      items:
        type: object
        properties:
          storage:
            type: string
            enum:
              - 'candidate'

          device-group:
            type: array
            items:
              type: object
              properties:
                label:
                  type: string
                  enum:
                    - {deviceGroupLabel}
                target-firmware-list:
                  type: array
                  description: >
                    'delete existing and replace
                    from [updatedTargetFirmwareList]'

          device:
            type: array
            items:
              type: object
              properties:
                mount-name:
                  type: string
                  enum: [{affectedDevices}]
                firmware-list:
                  type: array
                  description: >
                    'delete existing and replace
                    from [updatedFirmwareList]'
