  /provide-existing-device:
    post:
      operationId: provideExistingDevice
      summary: 'Provides detailed information about an existing Device'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
              properties:
                mount-name:
                  type: string
      responses:
        '200':
          description: 'Device details provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - mount-name
                  - device-model
                  - firmware-list
                  - last-update
                properties:
                  mount-name:
                    type: string
                  device-model:
                    type: string
                  firmware-list:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - version
                        - status
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                        status:
                          type: string
                  controller-firmware-list:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - version
                        - status
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                        status:
                          type: string
                  odu-firmware-list:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - version
                        - status
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                        status:
                          type: string
                  application-firmware-list:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - version
                        - status
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                        status:
                          type: string
                  boot-firmware-list:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - version
                        - status
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                        status:
                          type: string
                  web-server-list:
                    type: array
                    items:
                      type: object
                      required:
                        - name
                        - version
                        - status
                      properties:
                        name:
                          type: string
                        version:
                          type: string
                        status:
                          type: string
                  last-update:
                    type: string
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
  /provide-existing-device-group:
    post:
      operationId: provideExistingDeviceGroup
      summary: 'Provides detailed information about an existing Device Group'
      tags:
        - IndividualServices
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - device-group-label
              properties:
                device-group-label:
                  type: string
      responses:
        '200':
          description: 'Device details provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - device-group-label
                  - device-model-name
                  - target-firmware-list
                  - device-list
                properties:
                  device-group-label:
                    type: string
                  device-model-name:
                    type: string
                  purge-date:
                    type: string
                  target-firmware-list:
                    type: array
                    items:
                      type: object
                      required:
                        - resource
                        - status
                      properties:
                        resource:
                          type: string
                        status:
                          type: string
                  device-list:
                    type: array
                    items:
                      type: string
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - 'EXPERIMENTAL'
                  - 'OPERATIONAL'
                  - 'DEPRECATED'
                  - 'OBSOLETE'
                  - 'UNKNOWN'
                  - 'NOT_YET_DEFINED'
