list-existing-firmware-resources:
  type: object
  properties:

    domain-controller:
      type: object
      description: >
        '! simplified representation !'
      properties:
        network-control-domain:
          type: array
          x-key: storage
          items:
            type: object
            properties:
              storage:
                type: string
                enum:
                  - 'running'
              firmware-resource:
                type: array
                x-key: name,version
                description: 'List of firmware releases available for autonomous management'
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: 'Name of the firmware component'
                    version:
                      type: string
                      description: 'Version of the firmware component'
                    server:
                      type: string
                      description: 'Reference to a server definition that documents the access credentials for downloading the firmware components'
                    source-uri:
                      type: string
                      description: 'URI specifying the remote-file-path for downloading the firmware component. Format:<protocol>://<host>[:port]/path'
                    file-name:
                      type: string
                      description: 'Name of the file, which is to be downloaded'
