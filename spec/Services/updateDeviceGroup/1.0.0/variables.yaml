update-device-group:
  type: object
  required:
    - deviceGroupLabel
    - purgeDate
  properties:
    deviceGroupLabel:
      type: string
    purgeDate:
      type: string

    deviceModel:
      type: string
      description: >
        'from [/domain-controller/network-control-domain=running/device-group={deviceGroupLabel}/device-model]'
    defaultDeviceGroup:
      type: string
      description: >
        'from [/domain-controller/network-control-domain=running/device-model={deviceModel}/default-device-group]'

domain-controller:
  type: object
  properties:
    network-control-domain:
      type: array
      items:
        type: object
        properties:
          storage:
            type: string
            enum:
              - 'candidate'
          device-group:
            type: array
            items:
              type: object
              properties:
                label:
                  type: string
                  enum:
                    - {deviceGroupLabel}
                purge-date:
                  type: string
                  description: >
                    'from [purgeDate] if given'
