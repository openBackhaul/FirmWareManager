create-or-update-firmware-resource:
  type: object
  required:
    - name
    - version
  properties:
    name:
      type: string
      description: >
        'Name of the firmware resource to be created or updated
        from {$input#/name}'
    version:
      type: string
      description: >
        'Version of the firmware resource to be created or updated
        from {$input#/version}'
    server:
      type: string
      description: >
        'Label of the server, from where the firmware resource can be downloaded
        from {$input#/server-label} if provided'
    source-uri:
      type: string
      description: >
        'URI specifying the remote-file-path for downloading the firmware resource.  Format:<protocol>://<host>[:port]/path
        from {$input#/source-uri} if provided'
    file-name:
      type: string
      description: >
        'Name firmware file on the server
        from {$input#/file-name} if provided'

    domain-controller:
      type: object
      description: >
        '! simplified representation !'
      properties:
        network-control-domain:
          type: array
          x-key: storage
          items:
            type: object
            properties:
              storage:
                type: string
                enum:
                  - 'running'
              firmware-resource:
                type: array
                x-key: name,version
                description: 'List of firmware releases available for autonomous management'
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      description: >
                        'Name of the firmware component
                        find [/create-or-update-firmware-resource/name]
                        or create [/create-or-update-firmware-resource/name]'
                    version:
                      type: string
                      description: >
                        'Version of the firmware component
                        find [/create-or-update-firmware-resource/version]
                        or create [/create-or-update-firmware-resource/version]'
                    server:
                      type: string
                      description: >
                        'Reference to a server definition that documents the access credentials for downloading the firmware components
                        set to value from [/create-or-update-firmware-resource/server] if provided'
                    source-uri:
                      type: string
                      description: >
                        'URI specifying the remote-file-path for downloading the firmware component. Format:<protocol>://<host>[:port]/path
                        set to value from [/create-or-update-firmware-resource/source-uri] if provided'
                    file-name:
                      type: string
                      description: >
                        'Name of the file, which is to be downloaded
                        set to value from [/create-or-update-firmware-resource/file-name] if provided'
